# Lance les trois parties de l'application :
#   db       : PostgreSQL
#   backend  : API Flask            -> http://localhost:5000/api
#   frontend : fichiers statiques   -> http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plante}
      POSTGRES_DB: ${POSTGRES_DB:-plante}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plante} -d ${POSTGRES_DB:-plante}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-plante}:${POSTGRES_PASSWORD:-plante}@db:5432/${POSTGRES_DB:-plante}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - instance:/app/instance              # vecteurs des fiches déjà calculés
      - hfcache:/root/.cache/huggingface    # modèle de langage déjà téléchargé
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  instance:
  hfcache:
